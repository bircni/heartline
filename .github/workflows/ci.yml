name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read # nx-set-shas looks up the last successful main run

jobs:
  # Nx Cloud (nxCloudId in nx.json) provides remote caching, run insights and self-healing CI.
  # Only projects affected since the last successful main build run; the image job below always runs.
  check:
    name: Lint, typecheck, test and build (affected)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v5
      # Unit, integration, PGlite and Postgres (testcontainers) tests; Docker is available on the runner.
      - run: pnpm exec nx affected -t lint format:check typecheck test build
      - name: Audit production dependencies
        run: pnpm exec nx record -- pnpm audit --prod --audit-level high
        continue-on-error: true
      - run: pnpm exec nx fix-ci
        if: always()

  e2e:
    name: End-to-end (affected)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v5
      - id: affected
        run: echo "projects=$(pnpm exec nx show projects --affected -t e2e --json)" >> "$GITHUB_OUTPUT"
      - if: steps.affected.outputs.projects != '[]'
        run: pnpm --filter @heartline/web exec playwright install --with-deps chromium
      - run: pnpm exec nx affected -t e2e
      - run: pnpm exec nx fix-ci
        if: always()
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7

  deploy-manifests:
    name: Kustomize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate rendered manifests
        run: |
          kubectl kustomize deploy/kustomize/overlays/sqlite > kustomize-sqlite.yaml
          kubectl kustomize deploy/kustomize/overlays/postgres > kustomize-pg.yaml
          docker run --rm -v "$PWD:/w" ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary /w/kustomize-sqlite.yaml /w/kustomize-pg.yaml

  # On a release tag, stops before anything is published when the tag and package.json disagree.
  version:
    name: Check the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - if: github.ref_type == 'tag'
        run: |
          version=$(jq -r .version apps/server/package.json)
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::$GITHUB_REF_NAME does not match version $version in apps/server/package.json"
            exit 1
          fi

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: [check, e2e, version]
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      # Pull requests build the image for the runner's architecture and smoke-test it; pushes publish multi-arch.
      - name: Build for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: heartline:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name hl -p 3000:3000 -e AUTH_SECRET=ci-secret-ci-secret-ci-secret-1234 -e ADMIN_PASSWORD=ci-password-ci-password heartline:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/readyz && break; sleep 1; done
          curl -fsS http://127.0.0.1:3000/healthz | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:3000/api/v1/openapi.json | grep -q '"openapi":"3.1.0"'
          curl -fsS http://127.0.0.1:3000/api/v1/version | grep -q '"name":"heartline"'
          docker logs hl | tail -20
          docker rm -f hl
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: heartline:ci
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && github.event_name == 'push'
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
      - name: Publish
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The image is published first, so the release never points at an image that does not exist yet.
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: image
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Release notes from CHANGELOG.md
        run: |
          node scripts/release-notes.ts "$GITHUB_REF_NAME" > release-notes.md
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$version"
          printf '\n### Container image\n\n```sh\ndocker pull %s\n```\n' "$image" >> release-notes.md
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a "-" is a prerelease and never becomes the latest release.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags=(--prerelease=true)
          else
            flags=(--prerelease=false --latest)
          fi
          # A re-run updates the release an earlier attempt created.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --notes-file release-notes.md "${flags[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$GITHUB_REF_NAME" --notes-file release-notes.md "${flags[@]}"
          fi
