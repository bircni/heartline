name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NX_NO_CLOUD: true

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v5
      - run: pnpm lint
      - run: pnpm format:check
      # Unit, integration, PGlite and Postgres (testcontainers) tests; Docker is available on the runner.
      - run: pnpm exec nx affected -t typecheck test build
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
        continue-on-error: true

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @heartline/web build
      - run: pnpm --filter @heartline/web exec playwright install --with-deps chromium
      - run: pnpm --filter @heartline/web e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7

  deploy-manifests:
    name: Helm and Kustomize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint deploy/helm/heartline
      - name: Validate rendered manifests
        run: |
          helm template ci deploy/helm/heartline > helm.yaml
          helm template ci deploy/helm/heartline --set replicaCount=2 --set database.url=postgres://ci > helm-pg.yaml
          helm template ci deploy/helm/heartline --set database.url=postgres://ci --set existingSecret=mine > helm-existing.yaml
          grep -A1 'name: DATABASE_URL' helm-existing.yaml | grep -q 'postgres://ci'
          kubectl kustomize deploy/kustomize/overlays/sqlite > kustomize-sqlite.yaml
          kubectl kustomize deploy/kustomize/overlays/postgres > kustomize-pg.yaml
          docker run --rm -v "$PWD:/w" ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary /w/helm.yaml /w/helm-pg.yaml /w/helm-existing.yaml /w/kustomize-sqlite.yaml /w/kustomize-pg.yaml

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: [check, e2e]
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      # Pull requests build the image for the runner's architecture and smoke-test it; pushes publish multi-arch.
      - name: Build for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: heartline:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name hl -p 3000:3000 -e AUTH_SECRET=ci-secret-ci-secret-ci-secret-1234 -e ADMIN_PASSWORD=ci-password-ci-password heartline:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/readyz && break; sleep 1; done
          curl -fsS http://127.0.0.1:3000/healthz | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:3000/api/v1/openapi.json | grep -q '"openapi":"3.1.0"'
          curl -fsS http://127.0.0.1:3000/api/v1/version | grep -q '"name":"heartline"'
          docker logs hl | tail -20
          docker rm -f hl
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: heartline:ci
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && github.event_name == 'push'
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
      - name: Publish
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    name: Publish Helm chart
    runs-on: ubuntu-latest
    needs: [image, deploy-manifests]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Package and push to GHCR (OCI)
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package deploy/helm/heartline --version "$version" --app-version "$version"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "heartline-${version}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
