name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NX_NO_CLOUD: true

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v5
      - run: pnpm lint
      - run: pnpm format:check
      # Unit, integration, PGlite and Postgres (testcontainers) tests; Docker is available on the runner.
      - run: pnpm exec nx affected -t typecheck test build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @heartline/web build
      - run: pnpm --filter @heartline/web exec playwright install --with-deps chromium
      - run: pnpm --filter @heartline/web e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7

  deploy-manifests:
    name: Helm and Kustomize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint deploy/helm/heartline
      - name: Validate rendered manifests
        run: |
          helm template ci deploy/helm/heartline > helm.yaml
          helm template ci deploy/helm/heartline --set replicaCount=2 --set database.url=postgres://ci > helm-pg.yaml
          kubectl kustomize deploy/kustomize/overlays/sqlite > kustomize-sqlite.yaml
          kubectl kustomize deploy/kustomize/overlays/postgres > kustomize-pg.yaml
          docker run --rm -v "$PWD:/w" ghcr.io/yannh/kubeconform:latest -strict -summary /w/helm.yaml /w/helm-pg.yaml /w/kustomize-sqlite.yaml /w/kustomize-pg.yaml

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: [check, e2e]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    name: Publish Helm chart
    runs-on: ubuntu-latest
    needs: [image, deploy-manifests]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Package and push to GHCR (OCI)
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package deploy/helm/heartline --version "$version" --app-version "$version"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "heartline-${version}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
