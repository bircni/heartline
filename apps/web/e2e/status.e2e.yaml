site:
  title: E2E status
  timezone: UTC
groups:
  - name: Core
    monitors:
      - {
          id: self-http,
          name: Status API,
          type: http,
          url: 'http://127.0.0.1:3100/healthz',
          interval: 5s,
          expect: { json: { ok: true } },
          software: { product: heartline },
        }
      - { id: self-tcp, name: Status port, type: tcp, host: 127.0.0.1, port: 3100, interval: 5s }
# A mail server nothing listens on: sign-up works, delivery just keeps retrying.
notifiers:
  - { id: mail, type: email, from: status@e2e.local, to: [ops@e2e.local], smtp: { host: 127.0.0.1, port: 2 } }
notifications: { incidents: false, maintenance: false, recovery: false }
auth:
  users:
    - { email: admin@e2e.local, name: E2E Admin, password: e2e-admin-password, role: admin }
    - { email: editor@e2e.local, name: E2E Editor, password: e2e-editor-password, role: editor }
# The suite signs in more often than people do.
rateLimit: { auth: { max: 1000, window: 1m } }
