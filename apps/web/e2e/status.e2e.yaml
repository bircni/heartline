site:
  title: E2E status
  timezone: UTC
groups:
  - name: Core
    monitors:
      - {
          id: self-http,
          name: Status API,
          type: http,
          url: 'http://127.0.0.1:3100/healthz',
          interval: 5s,
          expect: { json: { ok: true } },
          software: { product: heartline },
        }
      - { id: self-tcp, name: Status port, type: tcp, host: 127.0.0.1, port: 3100, interval: 5s }
auth:
  users:
    - { email: admin@e2e.local, name: E2E Admin, password: e2e-admin-password, role: admin }
