# heartline configuration. Values like ${VAR} are read from the environment.
# Monitors defined here are read-only in the admin UI; edit this file (or the ConfigMap) instead.

site:
  title: Homelab status
  description: Availability of self-hosted services
  timezone: Europe/Berlin
  # baseUrl: https://status.example.com   # defaults to BASE_URL
  public: true
  showVersions: false # show running versions to anonymous visitors (vulnerabilities never are)

retention:
  rawDays: 30 # raw check results; daily rollups are kept forever

groups:
  - name: Code
    monitors:
      - id: gitea
        name: Gitea
        type: http
        url: https://git.example.com/api/healthz
        interval: 60s
        expect: { status: [200], json: { status: pass } }
        degradedAfter: 800ms
        notify: [teams, email]
        autoIncident: true
        # Version and vulnerability tracking: `gitea` is in the built-in catalog, so the version is read
        # from /api/v1/version and vulnerabilities come from OSV.dev, NVD and CISA KEV, releases from endoflife.date.
        software: { product: gitea }

      - id: registry
        name: Container registry
        type: tcp
        host: registry.example.com
        port: 5000
        interval: 30s
        # Non-HTTP monitors need a version URL or a fixed version.
        software:
          {
            product: distribution,
            version: { static: '2.8.3' },
            cpe: 'cpe:2.3:a:linuxfoundation:docker_registry',
          }

      - id: grafana
        name: Grafana
        type: http
        url: https://grafana.example.com/api/health
        interval: 60s
        # The check response already contains the version: read it inline instead of probing separately.
        software: { product: grafana, version: { json: version } }

      - id: my-app
        name: My app
        type: http
        url: https://app.example.com/healthz
        interval: 60s
        # Self-built software: version from its own endpoint, latest release from your Gitea instance.
        software:
          product: my-app
          version: { url: https://app.example.com/version, json: version }
          releases: { gitea: https://git.example.com, repo: nicolas/my-app }
          # pinCycle: '1.4'   # stay on a release cycle; newer cycles are not counted as updates

  - name: Infrastructure
    monitors:
      - id: dns
        name: Internal DNS
        type: dns
        host: git.example.com
        record: A
        server: 10.0.0.53
        expect: [10.0.0.21]
        interval: 30s

      - id: mail-tls
        name: Mail certificate
        type: tls
        host: mail.example.com
        port: 993
        minDays: 14
        interval: 1h

      - id: backups
        name: Nightly backups
        type: plugin
        plugin: backup-age
        interval: 15m
        args: { path: /backups, max_age_hours: 26 }

notifiers:
  - id: teams
    type: teams
    webhookUrl: ${TEAMS_WEBHOOK_URL} # Teams channel → Workflows → "post to a channel when a webhook request is received"
  - id: email
    type: email
    from: status@example.com
    to: [ops@example.com]
    smtp:
      host: smtp.example.com
      port: 587
      user: ${SMTP_USER}
      password: ${SMTP_PASSWORD}

notifications:
  recovery: true
  incidents: true
  reminderEvery: 1h
  security: true # new vulnerabilities, urgency rising to high/critical, version changes

# Vulnerability and release data (all sources are free; NVD is faster with NVD_API_KEY).
software:
  refreshEvery: 6h
  sources: { osv: true, nvd: auto, endoflife: true, kev: true, releases: true }

auth:
  local: true
  users:
    - email: admin@example.com
      name: Admin
      password: ${ADMIN_PASSWORD}
      role: admin
  oidc:
    - id: gitea
      name: Gitea
      discoveryUrl: https://git.example.com/.well-known/openid-configuration
      clientId: ${GITEA_CLIENT_ID}
      clientSecret: ${GITEA_CLIENT_SECRET}
      scopes: [openid, profile, email, groups]
      groupsClaim: groups
      # Gitea sends "org" and "org:team" groups
      roles:
        'homelab:owners': admin
        'homelab:ops': editor
      defaultRole: none
