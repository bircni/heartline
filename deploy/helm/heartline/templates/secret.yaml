{{- if and .Values.secret.create (not .Values.existingSecret) }}
{{- $name := include "heartline.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $authSecret := .Values.secret.authSecret }}
{{- if not $authSecret }}
{{- if and $existing (index $existing.data "AUTH_SECRET") }}
{{- $authSecret = index $existing.data "AUTH_SECRET" | b64dec }}
{{- else }}
{{- $authSecret = randAlphaNum 48 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "heartline.labels" . | nindent 4 }}
type: Opaque
stringData:
  AUTH_SECRET: {{ $authSecret | quote }}
  {{- with .Values.database.url }}
  DATABASE_URL: {{ . | quote }}
  {{- end }}
  {{- range $key, $value := .Values.secret.values }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
