{{- $postgres := include "heartline.usesPostgres" . -}}
{{- if and (gt (int .Values.replicaCount) 1) (not $postgres) }}
{{- fail "replicaCount > 1 requires Postgres (database.url or database.urlSecret): SQLite supports a single writer" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "heartline.fullname" . }}
  labels:
    {{- include "heartline.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ if $postgres }}RollingUpdate{{ else }}Recreate{{ end }}
  selector:
    matchLabels:
      {{- include "heartline.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ .Values.config | sha256sum }}
        checksum/plugins: {{ toJson .Values.plugins.files | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "heartline.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "heartline.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        {{- if .Values.icmp.enabled }}
        sysctls:
          - name: net.ipv4.ping_group_range
            value: "0 2147483647"
        {{- end }}
      containers:
        - name: heartline
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: BASE_URL
              value: {{ .Values.baseUrl | quote }}
            - name: CONFIG_PATH
              value: /config/status.yaml
            - name: PLUGINS_DIR
              value: {{ if or .Values.plugins.existingConfigMap .Values.plugins.files }}/plugins-custom{{ else }}/plugins{{ end }}
            {{- if .Values.database.urlSecret.name }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.urlSecret.name }}
                  key: {{ .Values.database.urlSecret.key }}
            {{- else if not $postgres }}
            - name: DATABASE_URL
              value: sqlite:/data/status.db
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "heartline.secretName" . }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            {{- if or .Values.plugins.existingConfigMap .Values.plugins.files }}
            - name: plugins
              mountPath: /plugins-custom
              readOnly: true
            {{- end }}
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Values.existingConfigMap | default (include "heartline.fullname" .) }}
        - name: tmp
          emptyDir: {}
        - name: data
          {{- if and .Values.persistence.enabled (not $postgres) }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" (include "heartline.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.plugins.existingConfigMap }}
        - name: plugins
          configMap:
            name: {{ .Values.plugins.existingConfigMap }}
            defaultMode: 0555
        {{- else if .Values.plugins.files }}
        - name: plugins
          configMap:
            name: {{ include "heartline.fullname" . }}-plugins
            defaultMode: 0555
            items:
              {{- range $path, $_ := .Values.plugins.files }}
              - key: {{ $path | replace "/" "__" }}
                path: {{ $path }}
              {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
