image:
  repository: ghcr.io/bircni/heartline
  # Defaults to the chart appVersion.
  tag: ''
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''

# More than one replica requires Postgres (database.url); the scheduler elects a single leader.
replicaCount: 1

# Public URL of the status page. Used for links in notifications, OAuth redirects and the MCP resource.
baseUrl: https://status.example.com

# status.yaml content. Use ${VAR} for secrets and provide them via `secret.values` or `extraEnvFrom`.
config: |
  site:
    title: Status
    timezone: UTC
  groups:
    - name: Services
      monitors:
        - id: example
          name: Example
          type: http
          url: https://example.com
          interval: 60s
  auth:
    users:
      - email: admin@example.com
        name: Admin
        password: ${ADMIN_PASSWORD}
        role: admin

# Use a ConfigMap you manage yourself (key `status.yaml`) instead of `config`.
existingConfigMap: ''

secret:
  # Create a Secret with AUTH_SECRET and the values below. Set to false to bring your own (existingSecret).
  create: true
  # 32+ random characters; generated once and kept on upgrades when empty.
  authSecret: ''
  # Extra environment variables for ${VAR} references in status.yaml, e.g. ADMIN_PASSWORD, TEAMS_WEBHOOK_URL,
  # NVD_API_KEY for faster vulnerability lookups (https://nvd.nist.gov/developers/request-an-api-key)
  # and GITHUB_TOKEN for release lookups beyond GitHub's anonymous rate limit.
  values: {}
# Bring your own Secret (AUTH_SECRET, the ${VAR}s used in status.yaml, optionally DATABASE_URL and NVD_API_KEY).
existingSecret: ''

software:
  # Never contact OSV.dev, NVD, endoflife.date or CISA for version and vulnerability data (air-gapped clusters).
  offline: false

database:
  # Empty: SQLite on the persistent volume. Otherwise a postgres:// URL (or use urlSecret).
  url: ''
  urlSecret:
    name: ''
    key: url

persistence:
  # SQLite database volume (ignored when Postgres is configured).
  enabled: true
  size: 1Gi
  storageClass: ''
  accessModes: [ReadWriteOnce]
  existingClaim: ''

# Check plugins: mount a ConfigMap whose keys are files; use `plugins.files` to define them inline.
plugins:
  existingConfigMap: ''
  # files:
  #   backup-age/plugin.yaml: |
  #     name: backup-age
  #     command: ["sh", "check.sh"]
  # ConfigMap keys cannot contain "/", so inline files use "<plugin>__<file>" keys and are mapped back.
  files: {}

# ICMP (ping) checks need raw sockets.
icmp:
  enabled: false

extraEnv: []
extraEnvFrom: []

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ''
  annotations: {}
  hosts:
    - host: status.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 384Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

serviceAccount:
  create: true
  name: ''
  annotations: {}

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
