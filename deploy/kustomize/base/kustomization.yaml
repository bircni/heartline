apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: heartline
    includeSelectors: true
resources:
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: heartline-config
    files:
      - status.yaml
images:
  - name: ghcr.io/bircni/heartline
    newTag: 0.1.0
