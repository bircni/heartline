apiVersion: apps/v1
kind: Deployment
metadata:
  name: heartline
spec:
  replicas: 1
  template:
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: heartline
          image: ghcr.io/bircni/heartline
          ports:
            - { name: http, containerPort: 3000 }
          env:
            - { name: BASE_URL, value: https://status.example.com }
            - { name: CONFIG_PATH, value: /config/status.yaml }
          envFrom:
            # AUTH_SECRET, ADMIN_PASSWORD and other ${VAR}s used in status.yaml (see secret.example.yaml).
            - secretRef: { name: heartline }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
      volumes:
        - name: config
          configMap: { name: heartline-config }
        - name: tmp
          emptyDir: {}
